AWSTemplateFormatVersion: "2010-09-09"

Description: Template for the Auto Scaling Group

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "Export VPC and ALB Stack Names"
        Parameters:
          - VpcStackName
          - ALBStackName
      - Label:
          default: "Compute Configuration"
        Parameters:
          - AmiId
          - InstanceType

Parameters:
  VpcStackName:
    Description: The name of the VPC stack
    Type: String

  ALBStackName:
    Description: The name of the ALB stack
    Type: String

  AmiId:
    Description: Amazon Linux 2023 x86_64 image resolved in this Region
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

  InstanceType:
    Description: Amazon EC2 instance type for the instances
    Type: String
    AllowedValues:
      - t2.micro
      - t2.nano
      - t2.small
    Default: t2.micro

Resources:
  # Launch Template for EC2 instances
  PraticalLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        ImageId: !Ref AmiId
        InstanceType: !Ref InstanceType
        UserData:
          Fn::Base64: |
            #!/bin/bash
            set -euo pipefail
            dnf install -y httpd
            systemctl enable --now httpd
            printf '<h1>CloudFormation cross-stack lab</h1>\n' > /var/www/html/index.html
        SecurityGroupIds:
          - Fn::ImportValue: !Sub ${VpcStackName}-SecurityGroupWeb
        Monitoring:
          Enabled: true

  # Auto Scaling Group
  PraticalAutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      DesiredCapacity: 2
      HealthCheckGracePeriod: 300
      HealthCheckType: ELB
      Cooldown: 300
      LaunchTemplate:
        LaunchTemplateId: !Ref PraticalLaunchTemplate
        Version: !GetAtt PraticalLaunchTemplate.LatestVersionNumber
      MaxSize: 4
      MinSize: 2
      TargetGroupARNs:
        - Fn::ImportValue: !Sub ${ALBStackName}-PraticalTargetGroup
      VPCZoneIdentifier:
        - Fn::ImportValue: !Sub ${VpcStackName}-PrivateSubnet1
        - Fn::ImportValue: !Sub ${VpcStackName}-PrivateSubnet2
      Tags:
        - Key: Name
          Value: WebServerAutoScaling
          PropagateAtLaunch: true

  PraticalCpuUpPolicy:
    Type: AWS::AutoScaling::ScalingPolicy
    Properties:
      AutoScalingGroupName: !Ref PraticalAutoScalingGroup
      PolicyType: TargetTrackingScaling
      TargetTrackingConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ASGAverageCPUUtilization
        TargetValue: 70
